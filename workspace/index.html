<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#15372d">
  <meta name="description" content="在浏览器里体验 Pi Native CRM 的商机、Agent 审批、客户记忆和执行回查。">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="./workspace.css">
  <script type="module" src="./app.js"></script>
  <title>销售工作区 · Pi Native CRM</title>
</head>
<body>
  <a class="skip-link" href="#workspace-content">跳到工作区内容</a>
  <div class="workspace-shell">
    <aside class="rail">
      <a class="brand" href="../index.html">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
        <span>Pi Native CRM<small>销售工作区</small></span>
      </a>
      <nav class="workspace-nav" aria-label="工作区导航">
        <div class="nav-group">
          <p>工作区</p>
          <a href="#overview" data-route="overview"><i class="nav-icon" aria-hidden="true">▦</i> 概览</a>
          <a href="#workbench" data-route="workbench"><i class="nav-icon" aria-hidden="true">✧</i> Agent 工作台</a>
          <a href="#pipeline" data-route="pipeline"><i class="nav-icon" aria-hidden="true">▥</i> 销售管道</a>
          <a href="#inbox" data-route="inbox"><i class="nav-icon" aria-hidden="true">▣</i> 客户会话</a>
          <a href="#tasks" data-route="tasks"><i class="nav-icon" aria-hidden="true">✓</i> 跟进任务</a>
        </div>
        <div class="nav-group">
          <p>证据与规则</p>
          <a href="#memory" data-route="memory"><i class="nav-icon" aria-hidden="true">◇</i> 客户记忆</a>
          <a href="#ontology" data-route="ontology"><i class="nav-icon" aria-hidden="true">≋</i> 业务口径</a>
          <a href="#runs" data-route="runs"><i class="nav-icon" aria-hidden="true">≡</i> 运行记录</a>
        </div>
      </nav>
      <div class="rail-footer">
        <div class="rail-user"><span class="user-avatar" aria-hidden="true">林</span><span>林序<small>演示审核人</small></span></div>
        <a href="../about/">项目说明</a>
      </div>
    </aside>
    <div class="workspace-main">
      <header class="workspace-bar">
        <div class="workspace-path" aria-label="当前位置"><span>销售工作区</span><span aria-hidden="true">/</span><strong id="workspace-location">概览</strong></div>
        <div class="bar-actions"><span class="demo-label">静态演示</span><button type="button" class="button button-small" data-action="reset">重置</button></div>
      </header>
      <main class="content" id="workspace-content" tabindex="-1"></main>
      <noscript><p class="content">启用 JavaScript 后即可体验工作台。<a href="../about/">阅读项目说明</a></p></noscript>
    </div>
  </div>
  <div class="sr-only" id="announcement" role="status" aria-live="polite"></div>
  <dialog class="reset-dialog" id="reset-dialog" aria-labelledby="reset-title">
    <h2 id="reset-title">重置演示？</h2>
    <p>清除当前标签页里的审批决定、记忆和运行记录，恢复示例起点。</p>
    <form method="dialog" class="button-row">
      <button class="button" value="cancel" autofocus>取消</button>
      <button class="button button-primary" value="confirm">重置示例</button>
    </form>
  </dialog>
</body>
</html>
