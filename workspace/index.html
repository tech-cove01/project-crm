<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#15372d">
  <meta name="description" content="在浏览器里体验 Pi Native CRM 的商机、Agent 审批、客户记忆和执行回查。">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="./workspace.css">
  <link rel="stylesheet" href="./crm.css">
  <link rel="stylesheet" href="./agent.css">
  <link rel="stylesheet" href="./lab.css">
  <link rel="stylesheet" href="./workflow.css">
  <link rel="stylesheet" href="./desk.css">
  <script type="module" src="./app.js"></script>
  <title>销售工作区 · Pi Native CRM</title>
</head>
<body>
  <a class="skip-link" href="#workspace-content">跳到工作区内容</a>
  <div class="workspace-shell">
    <aside class="rail">
      <a class="brand" href="../index.html">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
        <span>Pi Native CRM<small>销售工作区</small></span>
      </a>
      <button type="button" class="rail-toggle" aria-expanded="false" aria-controls="workspace-nav">导航</button>
      <nav class="workspace-nav" aria-label="工作区导航" id="workspace-nav">
        <div class="nav-group">
          <p>工作区</p>
          <a href="#overview" data-route="overview"><i class="nav-icon" aria-hidden="true">▦</i> 概览</a>
          <a href="#workbench" data-route="workbench"><i class="nav-icon" aria-hidden="true">✧</i> Agent 工作台</a>
          <a href="#pipeline" data-route="pipeline"><i class="nav-icon" aria-hidden="true">▥</i> 销售管道</a>
        </div>
        <div class="nav-group">
          <p>客户经营</p>
          <a href="#inbox" data-route="inbox"><i class="nav-icon" aria-hidden="true">▣</i> 客户会话</a>
          <a href="#contacts" data-route="contacts"><i class="nav-icon" aria-hidden="true">⊙</i> 联系人</a>
          <a href="#risk" data-route="risk"><i class="nav-icon" aria-hidden="true">◉</i> 风险提醒</a>
          <a href="#agenda" data-route="agenda"><i class="nav-icon" aria-hidden="true">▦</i> 日程预约</a>
          <a href="#replies" data-route="replies"><i class="nav-icon" aria-hidden="true">▤</i> 快捷回复</a>
          <a href="#tasks" data-route="tasks"><i class="nav-icon" aria-hidden="true">✓</i> 跟进任务</a>
          <a href="#followups" data-route="followups"><i class="nav-icon" aria-hidden="true">↳</i> 跟进流程</a>
        </div>
        <div class="nav-group">
          <p>证据与规则</p>
          <a href="#memory" data-route="memory"><i class="nav-icon" aria-hidden="true">◇</i> 客户记忆</a>
          <a href="#ontology" data-route="ontology"><i class="nav-icon" aria-hidden="true">≋</i> 业务口径</a>
          <a href="#runs" data-route="runs"><i class="nav-icon" aria-hidden="true">≡</i> 运行记录</a>
          <a href="#evaluation" data-route="evaluation"><i class="nav-icon" aria-hidden="true">◈</i> 演示检查</a>
        </div>
        <div class="nav-group">
          <p>工作区管理</p>
          <a href="#analytics" data-route="analytics"><i class="nav-icon" aria-hidden="true">▥</i> 工作区指标</a>
          <a href="#settings" data-route="settings"><i class="nav-icon" aria-hidden="true">⊹</i> 工作区设置</a>
        </div>
      </nav>
      <div class="rail-footer">
        <div class="rail-user"><span class="user-avatar" aria-hidden="true">林</span><span>林序<small>演示审核人</small></span></div>
        <a href="../about/">项目说明</a>
      </div>
    </aside>
    <div class="workspace-main">
      <header class="workspace-bar">
        <div class="workspace-path" aria-label="当前位置"><span>销售工作区</span><span aria-hidden="true">/</span><strong id="workspace-location">概览</strong></div>
        <div class="bar-actions">
          <button type="button" class="button button-small search-trigger" data-action="search" aria-keyshortcuts="Control+K Meta+K">搜索 <kbd>Ctrl K</kbd></button>
          <span class="demo-label" title="所有操作仅处理合成数据">演示环境</span>
          <button type="button" class="button button-small" data-action="reset">重置</button>
        </div>
      </header>
      <main class="content" id="workspace-content" tabindex="-1"></main>
      <noscript><p class="content">启用 JavaScript 后即可体验工作台。<a href="../about/">阅读项目说明</a></p></noscript>
    </div>
  </div>
  <div class="sr-only" id="announcement" role="status" aria-live="polite"></div>
  <dialog class="reset-dialog" id="reset-dialog" aria-labelledby="reset-title">
    <h2 id="reset-title">重置演示？</h2>
    <p>清除当前标签页里的审批决定、记忆和运行记录，恢复示例起点。</p>
    <form method="dialog" class="button-row">
      <button class="button" value="cancel" autofocus>取消</button>
      <button class="button button-primary" value="confirm">重置示例</button>
    </form>
  </dialog>
  <dialog class="search-dialog" id="search-dialog" aria-labelledby="search-title">
    <form method="dialog" class="search-top"><h2 id="search-title">搜索工作区</h2><button type="submit" class="button button-small">关闭</button></form>
    <label class="sr-only" for="workspace-search">输入客户、商机或页面名</label>
    <input type="search" id="workspace-search" placeholder="输入客户、商机或页面名" autofocus>
    <div id="search-results" class="search-results"></div>
  </dialog>
</body>
</html>
