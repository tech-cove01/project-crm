<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6ef">
  <meta name="description" content="Pi Native CRM 的系统架构与 Run 状态图。在演示台操作客户会话、Agent 取证与审批回查。">
  <title>Pi Native CRM · 项目展示</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./about/about.css">
  <link rel="stylesheet" href="./home.css?v=intro-cta">
  <script type="module" src="./about/architecture.js?v=inline-architecture"></script>
</head>
<body class="project-home">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="topbar">
    <div class="home-topbar home-width" id="context">
      <span class="brand"><span class="brand-mark" aria-hidden="true"></span>Pi Native CRM</span>
    </div>
  </header>
  <main class="home-width" id="main">
    <section class="home-intro" id="difficulties" aria-labelledby="main-title">
      <h1 id="main-title">销售跟进的 Agent 工作区</h1>
      <p>从会话和商机取证。阶段变更经人工批准，执行后读取实际业务结果。</p>
      <a class="button button-primary demo-entry" href="./workspace/#overview">打开演示台</a>
    </section>

    <section class="home-architecture" id="architecture" aria-labelledby="architecture-title">
      <div class="home-diagram-heading" id="highlights">
        <h2 id="architecture-title">系统架构</h2>
        <p id="agent-help">选择节点，查看职责、数据来源或校验边界。</p>
      </div>
      <figure class="diagram system-diagram" id="architecture-board" data-inline aria-label="从工作台、队列和工具到数据与评测的系统图">
        <p class="diagram-fallback">工作台限定组织、角色和商机范围，Worker 领取已落库作业。Pi 经许可工具读取业务数据与资料，由负责人审批阶段变更；执行后回到 SQL 核对状态。</p>
      </figure>
    </section>

    <section class="home-architecture home-run" id="run-states" aria-labelledby="run-title">
      <div class="home-diagram-heading" id="implementation">
        <h2 id="run-title">运行与审批状态</h2>
        <p>切换查看只读、人审执行，以及停止后需要复核的路径。</p>
      </div>
      <figure class="diagram run-diagram" id="run-board" data-inline aria-label="Run 队列、提案审批与异常分支图">
        <p class="diagram-fallback">只读任务可以直接完成。阶段写入等待人工批准。证据缺失、提案拒绝或写入结果不明时，保留相应记录供复核。</p>
      </figure>
    </section>
  </main>
  <footer class="home-width home-footnote"><p>演示台使用浏览器内的合成数据。</p></footer>
</body>
</html>
